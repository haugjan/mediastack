<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aircheckarr</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Aufbau wie Sonarr, Radarr und Lidarr: Kopfleiste, Seitenleiste links,
     Werkzeugleiste ueber dem Inhalt. Wer die anderen kennt, findet sich
     hier ohne Anleitung zurecht. Gezeichnet wird alles von app.js. -->
<header class="kopf">
  <button class="menue" id="menue" aria-label="Menü" title="Menü">
    <svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="marke" href="#/wuensche">
    <img src="favicon.svg" alt="" width="32" height="32">
    <span>aircheckarr</span>
  </a>
  <label class="suche">
    <svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="suche" type="search" placeholder="Filtern" autocomplete="off" spellcheck="false">
  </label>
  <span class="verbindung" id="verbindung" hidden>Keine Verbindung</span>
</header>

<aside class="leiste" id="leiste">
  <nav id="navigation"></nav>
</aside>
<div class="leiste-schatten" id="leiste-schatten"></div>

<main class="seite">
  <div class="werkzeug" id="werkzeug"></div>
  <div class="inhalt" id="inhalt"></div>
</main>

<div class="auswahl" id="auswahl" hidden></div>
<div class="dialog-huelle" id="dialog" hidden></div>
<div class="meldungen" id="meldungen" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
